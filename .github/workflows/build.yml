name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Build
        run: pyinstaller --onefile --noconsole --name pc_power pc_power.py

      - name: Smoke test
        shell: pwsh
        run: |
          # First run with no config.json should write the template and exit cleanly.
          $p = Start-Process dist\pc_power.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Test-Path dist\config.json)) { throw "config.json template not written" }
          Remove-Item dist\config.json

      - uses: actions/upload-artifact@v4
        with:
          name: pc_power
          path: |
            dist/pc_power.exe
            config.example.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pc_power.exe
            config.example.json
