name: Build exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Check Windows sensors
        shell: pwsh
        run: |
          '{"host": "8.8.8.8"}' | Out-File -Encoding utf8NoBOM config.json
          python -c "import pc_power as p; print(p.read_sensors(), p.local_mac(), round(p.idle_seconds()), p.tray_image('connected').size)"
          Remove-Item config.json, pc_power.log -ErrorAction SilentlyContinue

      - name: Build
        run: pyinstaller --onefile --noconsole --name pc_power pc_power.py

      - name: Smoke test
        shell: pwsh
        run: |
          # First run with no config.json should write the template and exit cleanly.
          $p = Start-Process dist\pc_power.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Test-Path dist\config.json)) { throw "config.json template not written" }
          Remove-Item dist\config.json

      - uses: actions/upload-artifact@v4
        with:
          name: pc_power
          path: |
            dist/pc_power.exe
            config.example.json

      # Every push to main publishes a release, tagged v1.0.<run number>.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: pc_power v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/pc_power.exe
            config.example.json
